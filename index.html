body{margin:0;color:var(--tx);font:400 15px/1.7 Vazirmatn,Tahoma,sans-serif;padding-bottom:110px;background-color:#fff;background-image:radial-gradient(circle at 92% -4%,#b8f4ee 0,transparent 38%),radial-gradient(circle at -6% 34%,#c9ecff 0,transparent 34%),radial-gradient(circle at 105% 78%,#d5faf3 0,transparent 32%);background-attachment:fixed}
html{background:#fff;color-scheme:light}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(255,255,255,.75);backdrop-filter:blur(14px);z-index:10}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:sticky;top:env(safe-area-inset-top,0px);background:rgba(255,255,255,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:5}
.lg{display:block;width:116px;height:26px;background:var(--tx);-webkit-mask:var(--logo) no-repeat right center/contain;mask:var(--logo) no-repeat right center/contain}
.cb{position:relative;width:46px;height:46px;border-radius:50%;background:var(--cd);backdrop-filter:blur(12px);color:var(--tx);box-shadow:var(--gl);border:1px solid rgba(255,255,255,.9);padding:0}
.cb b{position:absolute;top:-4px;left:-4px;background:linear-gradient(135deg,#ff6b8b,#ff3d6e);color:#fff;border-radius:99px;font-size:11px;min-width:19px;height:19px;line-height:19px;padding:0 4px}
main{padding:0 16px;max-width:560px;margin:auto}
h1{margin:0}h2{font-size:17px;font-weight:800;margin:20px 0 10px}.h1{font-size:28px;font-weight:800;line-height:1.4;margin:4px 0}.h1 .ic{color:var(--t1);width:.9em;height:.9em}
.card,.it{background:var(--cd);backdrop-filter:blur(16px) saturate(160%);-webkit-backdrop-filter:blur(16px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:14px;margin-bottom:12px;box-shadow:var(--gl)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.mu{color:var(--mu);font-size:13px}
button{font:inherit;cursor:pointer;border:0;border-radius:999px;padding:11px 20px;background:var(--bt);color:#fff;font-weight:700;box-shadow:var(--ng)}
button.g{background:var(--cd);color:var(--tx);box-shadow:var(--gl);border:1px solid rgba(255,255,255,.9)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--t2);outline-offset:2px}
.hc{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(25,214,200,.96),rgba(15,169,224,.92));color:#fff;border-radius:34px;padding:18px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0 6px;box-shadow:0 20px 36px -16px rgba(15,185,215,.75),0 0 28px rgba(40,235,240,.35),inset 0 1px 0 rgba(255,255,255,.6)}
.hc::before{content:"";position:absolute;top:-60%;right:-20%;width:70%;height:160%;background:radial-gradient(circle,rgba(255,255,255,.35),transparent 60%);pointer-events:none}
.hc>*{position:relative}.hc b{font-size:20px;line-height:1.5;display:block}.hc small{display:block;opacity:.88;font-size:12.5px;line-height:1.7}
.ly{background:rgba(255,255,255,.26);border:1px solid rgba(255,255,255,.65);box-shadow:none;color:#fff;padding:5px 16px;font-size:13px}
.bn{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.ly.w{background:#fff;color:var(--pr);border-color:#fff;box-shadow:0 0 16px rgba(255,255,255,.65)}.ly .ic{width:16px;height:16px;margin-left:5px}
.ms{width:76px;height:84px;border-radius:26px;object-fit:cover;flex:none;background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.dr{border-radius:50%;background:linear-gradient(145deg,#fff,#b9dce6);padding:7%;flex:none;width:var(--s);height:var(--s);box-shadow:0 0 0 5px rgba(25,214,200,.18),0 0 30px rgba(30,230,240,.6),0 10px 22px rgba(10,120,150,.25)}
.dr>i{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 50% 78%,#46eadb,#16b6d6 55%,#0f8fbd);font-style:normal;color:#fff;font-size:calc(var(--s)*.32);line-height:1.2;padding:8%}
.dr small{font-size:13px;font-weight:600;margin-top:4px}
.tb{display:flex;margin:14px 0 0;border-bottom:1px solid var(--bd)}
.tb button{flex:1;background:none;color:var(--tx);box-shadow:none;border-radius:0;padding:10px 4px;font-weight:600;border-bottom:3px solid transparent}
.tb button.on{color:var(--pr);border-color:var(--t1);box-shadow:0 8px 10px -8px var(--t1)}
.it{display:flex;align-items:center;gap:8px;padding:10px}
.it>div:nth-child(2){flex:1;min-width:0}.ti{width:54px;height:54px;border-radius:22px;background:var(--tl);display:flex;align-items:center;justify-content:center;flex:none}
.ti .ic{width:32px;height:32px;color:var(--ib)}
.it select.sv{width:auto;border:0;background:none;color:var(--pr);font-size:12.5px;font-weight:700;padding:0;margin:0;display:block;border-radius:0}
.pr{font-weight:800;white-space:nowrap}.pr small{font-weight:400;color:var(--mu);font-size:11px}
.st{display:flex;align-items:center;gap:6px}.st b{min-width:20px;text-align:center}
.st button{width:34px;height:34px;padding:0;border-radius:50%;font-size:19px;line-height:1}
.st button.m{background:rgba(255,255,255,.8);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
input,select,textarea{width:100%;font:inherit;padding:11px 16px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:20px;background:rgba(255,255,255,.7);color:var(--tx)}
label{font-size:13px;color:var(--mu)}
nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:14px;right:14px;max-width:532px;margin:auto;display:flex;background:rgba(255,255,255,.72);backdrop-filter:blur(20px) saturate(170%);-webkit-backdrop-filter:blur(20px) saturate(170%);border:1px solid rgba(255,255,255,.95);border-radius:36px;box-shadow:0 14px 34px -10px rgba(14,170,200,.35),inset 0 1px 0 #fff;padding:7px;z-index:6}
nav button{flex:1;background:none;color:var(--mu);font-size:12px;padding:6px 2px;box-shadow:none;border-radius:28px;font-weight:600}nav button.on{color:var(--pr);background:var(--tl);box-shadow:0 0 16px rgba(30,230,240,.3)}nav i{display:block;font-style:normal;font-size:22px;line-height:1.3}
.fab{position:fixed;right:18px;left:18px;bottom:calc(88px + env(safe-area-inset-bottom,0px));max-width:524px;margin:auto;display:flex;justify-content:space-between;z-index:5;padding:15px 22px}
.sh{position:fixed;inset:0;background:rgba(10,40,60,.35);backdrop-filter:blur(4px);z-index:20;display:flex;align-items:flex-end}
.sh>div{background:rgba(250,254,255,.96);width:100%;max-height:92%;overflow:auto;border-radius:36px 36px 0 0;padding:20px 16px 0;max-width:560px;margin:auto}
.ft{position:sticky;bottom:0;background:rgba(255,255,255,.85);backdrop-filter:blur(14px);margin:14px -16px 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));border-radius:32px 32px 0 0;box-shadow:0 -10px 24px -8px rgba(14,170,200,.25)}
.dk{background:var(--cd);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.95);color:var(--tx);border-radius:36px;padding:20px;margin-bottom:14px;box-shadow:var(--gl)}
.tg{display:flex;gap:8px;margin:12px 0}.tg button{flex:1;background:rgba(255,255,255,.7);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.tg button.on{background:var(--bt);color:#fff;border-color:transparent;box-shadow:var(--ng)}
.bar{position:relative;height:46px;border-radius:999px;background:var(--tl);overflow:hidden;text-align:center;line-height:46px;font-weight:700}
.bar i{position:absolute;inset:0 0 0 auto;background:var(--bt);border-radius:999px;box-shadow:0 0 16px rgba(30,230,240,.7)}.bar span{position:relative;color:var(--tx)}
.tk{background:var(--tl);color:var(--tx);border-radius:26px;padding:12px 16px;border:1.5px dashed var(--t1);margin-bottom:12px}
.tk b{font-size:17px}
.tt{position:fixed;top:70px;left:16px;right:16px;margin:auto;max-width:360px;background:rgba(11,42,63,.92);color:#fff;padding:11px 16px;border-radius:999px;z-index:30;text-align:center}

const list=m=>m==='repair'?REP.map(r=>({id:r[0],n:r[1],p:r[2]*1000})):ITEMS.map(i=>({id:i[0],n:i[1],p:i[m==='iron'?2:3]*1000}));

fee=n?(sb||s>=300000?0:30000):0;return{s,n,disc,fee,t:s-disc+fee,sb}}

function plans(){let h='<h2>اشتراک ماهانه</h2><p class="mu">ارسال رایگان و تخفیف روی همه سفارش‌های ماه.</p>';
if(S.sub)h+=`<div class="tk"><b>اشتراک ${S.sub.n} فعال است</b><div class="mu">${f(S.sub.left)} سفارش باقی‌مانده</div></div>`;
for(const p of PLANS)h+=`<div class="card row"><div><b>${p.n}</b><div class="mu">${f(p.c)} سفارش در ماه، ${f(p.d)}٪ تخفیف، ارسال رایگان</div></div><div style="text-align:left"><div>${f(p.p)} تومان</div><button onclick="subscribe('${p.n}')">خرید</button></div></div>`;
return h}
function subscribe(n){const p=PLANS.find(x=>x.n===n);S.sub={n,left:p.c};save();render();toast('اشتراک '+n+' فعال شد')}
function lines(o){return o.items.map(([k,q])=>f(q)+'× '+esc(find(k).n)).join('، ')}
function orders(){let h='<h2 style="margin-top:6px">سفارش‌ها</h2>';const a=active();
if(a){const pc=Math.max(6,Math.round(a.st/4*100)),v=S.tv||'t';
h+=`<div class="dk"><b style="font-size:19px">سفارش ${fi(a.id)} در جریان است</b><p style="opacity:.7;font-size:13px;margin:4px 0">${a.day}، بازه ${a.slot}</p><div class="tg"><button class="${v=='t'?'on':''}" onclick="S.tv='t';render()">وضعیت</button><button class="${v=='c'?'on':''}" onclick="S.tv='c';render()">لباس‌ها</button></div>`;
h+=v=='t'?`<div style="display:flex;justify-content:center;margin:16px 0">${drum(176,ic('drop'),STEPS[a.st])}</div>`:`<div style="margin:12px 0;line-height:2.2">${a.items.map(([k,q])=>`<div class="row"><span>${esc(find(k).n)}</span><b>${f(q)}×</b></div>`).join('')}</div>`;
h+=`<div class="bar"><i style="width:${pc}%"></i><span>${f(pc)}٪</span></div></div>`}
const past=S.orders.filter(o=>o!==a).reverse();
if(!S.orders.length)h+='<div class="card mu">هنوز سفارشی ثبت نکرده‌اید. از صفحه خدمات لباس‌هایتان را انتخاب کنید.</div>';
for(const o of past)h+=`<div class="card"><div class="row"><b>سفارش ${fi(o.id)}</b><span class="mu">${o.day}</span></div><div class="mu">${lines(o)}</div><div class="row" style="margin-top:10px"><span>${f(o.total)} تومان، ${STEPS[o.st]}</span><button class="g" onclick="reorder('${o.id}')">سفارش مجدد</button></div></div>`;
return h}
function reorder(id){const o=S.orders.find(x=>x.id==id);S.cart={};o.items.forEach(([k,q])=>S.cart[k]=q);save();render();openCart()}
function openCart(){S.shopen=true;cart()}
function cart(){const t=tot(),u=S.u;let h='<div class="row"><b style="font-size:21px">سبد خرید</b><button class="g" onclick="closeCart()">بستن</button></div><div style="height:12px"></div>';
if(!t.n)h+='<p class="mu">سبد خالی است. چند لباس از صفحه خدمات اضافه کنید.</p><div style="height:20px"></div>';
else{for(const k in S.cart){const x=find(k);h+=`<div class="it"><div class="ti">${IC[k.split('|')[0]]}</div><div><b>${esc(x.n)}</b><div class="mu">${f(x.p)} تومان / عدد</div><b>${f(x.p*S.cart[k])}</b></div><div class="st"><button class="m" onclick="add('${k}',-1)">−</button><b>${f(S.cart[k])}</b><button onclick="add('${k}',1)">+</button></div></div>`}
h+=`<label>نام و نام خانوادگی</label><input value="${esc(u.name||'')}" oninput="S.u.name=this.value">
<label>شماره موبایل</label><input inputmode="tel" placeholder="۰۹۱۲۰۰۰۰۰۰۰" value="${esc(u.phone||'')}" oninput="S.u.phone=this.value">
<label>آدرس جمع‌آوری و تحویل</label><textarea rows="2" oninput="S.u.addr=this.value">${esc(u.addr||'')}</textarea>
<div class="row" style="gap:10px"><div style="flex:1"><label>روز</label><select onchange="S.day=this.value"><option ${S.day=='امروز'?'selected':''}>امروز</option><option ${S.day=='فردا'?'selected':''}>فردا</option></select></div>
<div style="flex:1"><label>بازه ساعتی</label><select onchange="S.slot=this.value">${SLOTS.map(s=>`<option ${S.slot==s?'selected':''}>${s}</option>`).join('')}</select></div></div>

$('#sh').innerHTML=`<div class="sh" onclick="if(event.target==this)closeCart()"><div>${h}</div></div>`}
function closeCart(){S.shopen=false;save();$('#sh').innerHTML=''}
function submit(){const u=S.u,ph=en(u.phone||'').replace(/\D/g,'');
if(!(u.name||'').trim())return toast('نام را وارد کنید');if(!/^09\d{9}$/.test(ph))return toast('شماره موبایل باید ۱۱ رقم و با ۰۹ شروع شود');if(!(u.addr||'').trim())return toast('آدرس را وارد کنید');
const t=tot(),o={id:String(1000+S.orders.length+1),items:Object.entries(S.cart),total:t.t,name:u.name,phone:ph,addr:u.addr,day:S.day,slot:S.slot,pay:S.pay,note:u.note||'',st:0,t:Date.now()};
S.orders.push(o);if(t.sb)S.sub.left--;S.cart={};save();closeCart();S.tab='orders';render();toast('سفارش '+fi(o.id)+' ثبت شد')}
function admin(){if(!S.admin)return`<h2>پنل مدیریت</h2><div class="card"><label>رمز ورود (نسخه نمایشی: ۱۲۳۴)</label><input id="pin" type="password" inputmode="numeric"><button onclick="if(en($('#pin').value)==PIN){S.admin=true;render()}else toast('رمز اشتباه است')">ورود</button></div>`;
const O=S.orders,rev=O.reduce((a,o)=>a+o.total,0),cu={};O.forEach(o=>{const c=cu[o.phone]=cu[o.phone]||{n:o.name,ph:o.phone,c:0,s:0,l:0};c.c++;c.s+=o.total;c.l=Math.max(c.l,o.t)});
let h=`<h2>پنل مدیریت</h2><div class="row" style="gap:8px"><div class="card" style="flex:1"><div class="mu">سفارش‌ها</div><b>${f(O.length)}</b></div><div class="card" style="flex:1"><div class="mu">فروش</div><b>${f(rev)}</b></div><div class="card" style="flex:1"><div class="mu">مشتری</div><b>${f(Object.keys(cu).length)}</b></div></div><h2>سفارش‌ها</h2>`;
if(!O.length)h+='<div class="card mu">سفارشی وجود ندارد.</div>';
for(const o of O.slice().reverse())h+=`<div class="card"><div class="row"><b>${fi(o.id)} – ${esc(o.name)}</b><span class="mu">${o.day}، ${o.slot}</span></div><div class="mu">${esc(o.phone)} | ${esc(o.addr)}</div><div>${lines(o)}</div><div class="mu">${o.pay=='online'?'آنلاین':'درب منزل'}${o.note?' | '+esc(o.note):''}</div><select onchange="setSt('${o.id}',this.value)">${STEPS.map((s,i)=>`<option value="${i}" ${o.st==i?'selected':''}>${s}</option>`).join('')}</select></div>`;
h+='<h2>مشتریان (CRM)</h2>';for(const c of Object.values(cu).sort((a,b)=>a.l-b.l))h+=`<div class="card row"><div>${esc(c.n)}<div class="mu">${f(c.c)} سفارش، ${f(c.s)} تومان، آخرین: ${ago(c.l)}</div></div><a href="sms:${c.ph}?body=${encodeURIComponent('سلام '+c.n+'، امروز لباسی برای شست‌وشو دارید؟ سفارش در چند ثانیه ثبت می‌شود.')}"><button class="g">یادآوری</button></a></div>`;
return h+'<button class="g" onclick="S.admin=false;render()">خروج</button>'}
function setSt(id,v){S.orders.find(o=>o.id==id).st=+v;save();toast('وضعیت به‌روز شد')}
const CH={m:[],chips:[],step:'',tmp:{},ty:0,init:0,last:[]},
MAIN=[['ثبت سفارش','order'],['پیگیری سفارش','track'],['سفارش مجدد','reorder'],['اشتراک ماهانه','subs'],['سوالات متداول','faq']],
FLD=['name','phone','addr','day','slot','pay'],
KW=[['kpants',/شلوار\s*(بچ|کودک)/],['kshirt',/بچگانه|بچه|کودک/],['pants',/شلوار/],['shirt',/پیرا?هن/],['suit',/(^|\s)کت(\s|$)/],['coat',/پالتو|کاپشن/],['dress',/مجلسی/],['manto',/مانتو|تونیک/],['skirt',/دامن/],['sheet',/ملحفه|روتختی/],['curtain',/پرده/],['r1',/کوتاه/],['r2',/زیپ/],['r3',/رفو|سوختگی|پارگی/],['r4',/دکمه|ریشه/]],
NW={یه:1,یک:1,یکی:1,دو:2,سه:3,چهار:4,پنج:5,شش:6,هفت:7,هشت:8,ده:10},
FQ={t:'لباس‌ها توی بازه‌ای که انتخاب می‌کنی جمع می‌شن و معمولاً ۲۴ تا ۴۸ ساعت بعد تحویل می‌گیری (زمان دقیق بسته به نوع خدمت).',s:'ارسال برای سفارش بالای ۳۰۰ هزار تومان و برای مشترک‌ها رایگانه و زیر اون ۳۰ هزار تومانه.',p:'می‌تونی آنلاین پرداخت کنی یا درب منزل، هر کدوم که راحت‌تری.',d:'اگه مشکلی برای لباس پیش اومد، به پشتیبانی بگو تا فوری بررسی کنن و طبق قرارداد پیگیری بشه.',i:'آره، «فقط اتو» هم داریم و قیمتش کمتر از شست‌وشوئه. موقع انتخاب لباس نوعش رو بزن.'},
iname=id=>(ITEMS.find(x=>x[0]==id)||REP.find(x=>x[0]==id))[1],isRep=id=>REP.some(x=>x[0]==id),
bdg=()=>{const t=tot();$('#bc').textContent=f(t.n);$('#bc').style.display=t.n?'':'none'},
addC=(id,m,q)=>{const k=id+'|'+m;S.cart[k]=(S.cart[k]||0)+q;save();bdg()},
ccard=()=>{const t=tot();return`<div class="cd">${Object.keys(S.cart).map(k=>`<div class="row"><span>${f(S.cart[k])}× ${esc(find(k).n)}</span><span>${f(find(k).p*S.cart[k])}</span></div>`).join('')}<div class="row"><b>مبلغ نهایی</b><b>${f(t.t)} تومان</b></div><div class="mu">${t.disc?'شامل تخفیف اشتراک. ':''}ارسال: ${t.fee?f(t.fee)+' تومان':'رایگان'}</div></div>`},
cf=s=>s=='day'?[['امروز','day:امروز'],['فردا','day:فردا']]:s=='slot'?SLOTS.map(z=>['ساعت '+z,'slot:'+z]):s=='pay'?[['پرداخت آنلاین','pay:online'],['درب منزل','pay:door']]:(S.u[s]?[['همون قبلی: '+String(S.u[s]).slice(0,22),'prev']]:[]);
function cq(s){const m=en(s).match(/\d+/);if(m)return Math.min(+m[0],30);for(const w in NW)if(new RegExp('(^|\\s)'+w+'(\\s|‌|تا|$)').test(s))return NW[w];return 1}
function parseO(t){const out=[];let asm=0;for(const g of t.split(/[،,\n+]|\sو\s/)){const hit=KW.find(k=>k[1].test(g));if(!hit)continue;const id=hit[0];let m='wash';if(isRep(id))m='repair';else if(/اتو/.test(g)&&!/شست|بشور/.test(g))m='iron';else if(!/شست|بشور|اتو/.test(g))asm=1;out.push([id,m,cq(g)])}return{out,asm}}
function chm(){return CH.m.map(m=>`<div class="mr ${m.r}">${m.r=='b'?'<span class="av"></span>':''}<div class="bb">${esc(m.t||'')}${m.h||''}</div></div>`).join('')+(CH.ty?'<div class="mr b"><span class="av"></span><div class="bb ty"><span></span><span></span><span></span></div></div>':'')}
function chc(){return CH.chips.map((c,i)=>`<button class="chip" onclick="act(${i})">${esc(c[0])}</button>`).join('')}
function chUp(){const e=$('#cm');if(!e)return;e.innerHTML=chm();$('#cc').innerHTML=chc();scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}
function bs(a,chips){a=[].concat(a);CH.ty=1;CH.chips=[];chUp();let i=0;const nx=()=>{const x=a[i++];CH.m.push(typeof x=='string'?{r:'b',t:x}:{r:'b',...x});if(i<a.length){chUp();setTimeout(nx,550)}else{CH.ty=0;CH.chips=chips||[];chUp()}};setTimeout(nx,550)}
function us(t){CH.m.push({r:'u',t});CH.chips=[];chUp()}
function act(i){const c=CH.chips[i];if(!c)return;us(c[0]);route(c[1])}
function sendT(){const e=$('#ti'),v=e.value.trim();if(!v)return;e.value='';us(v);cText(v)}
function chat(){if(!CH.init){CH.init=1;CH.m=[{r:'b',t:'سلام! من پیک‌یار OnWash هستم و لباس‌هات رو درب منزل جمع می‌کنم. می‌تونی با دکمه‌ها جلو بری یا همین‌جا بنویسی، مثلا «۲ تا پیراهن اتو و ۱ کت شست‌وشو».'}];CH.chips=MAIN}
return`<div class="ch"><span class="av big"></span><div><b>دستیار OnWash</b><div class="mu"><span class="dot"></span>آنلاین</div></div></div><div class="cm" id="cm">${chm()}</div><div class="cp"><div class="cc" id="cc">${chc()}</div><div class="cin"><input id="ti" placeholder="پیام بنویس... مثلا ۲ تا پیراهن اتو" enterkeyhint="send" onkeydown="if(event.key=='Enter')sendT()"><button class="sd" aria-label="ارسال" onclick="sendT()">↑</button></div></div>`}
function route(c){const i=c.indexOf(':'),k=i<0?c:c.slice(0,i),v=i<0?'':c.slice(i+1);const R={order:cItems,track:cTrack,reorder:cRe,subs:cSubs,faq:cFaq,menu:cMenu,go:cGo,clear:cClear,iron:cIron,yes:cPlace,prev:()=>cSet(S.u[CH.step]),grp:cGrp,item:cItem,qty:cQty,svc:cSvc,plan:cPlan,fq:cFq,day:cSet,slot:cSet,pay:cSet};(R[k]||cMenu)(v)}
const cMenu=()=>bs('چه کمکی می‌تونم بکنم؟',MAIN);
function cItems(){CH.step='';bs('عالیه! لباس‌هات رو بنویس، مثلا «۲ تا پیراهن اتو و ۱ کت شست‌وشو»، یا از دسته‌ها انتخاب کن.',[['مردانه','grp:m'],['زنانه','grp:w'],['بچگانه','grp:k'],['سایر و رفو','grp:o']].concat(tot().n?[['ادامه سفارش','go']]:[]))}
function cGrp(v){const l=v=='o'?ITEMS.filter(x=>x[4]=='o').concat(REP):ITEMS.filter(x=>x[4]==v);bs('کدوم رو می‌خوای؟',l.map(x=>[x[1],'item:'+x[0]]).concat([['برگشت','order']]))}
function cItem(id){CH.tmp={item:id};CH.step='qty';bs(iname(id)+' چند تا؟ عدد رو بنویس یا بزن.',[1,2,3,4,5].map(n=>[f(n),'qty:'+n]))}
function cQty(n){n=+n||1;CH.tmp.q=n;if(isRep(CH.tmp.item)){addC(CH.tmp.item,'repair',n);CH.step='';return cAdded('اضافه شد.')}CH.step='svc';bs('فقط اتو یا شست‌وشو و اتو؟',[['فقط اتو','svc:iron'],['شست‌وشو و اتو','svc:wash']])}
function cSvc(m){addC(CH.tmp.item,m,CH.tmp.q);CH.step='';cAdded('اضافه شد.')}
function cAdded(t,ex){bs([{t,h:ccard()}],(ex||[]).concat([['لباس دیگه','order'],['ادامه سفارش','go'],['خالی کردن سبد','clear']]))}
function cIron(){CH.last.forEach(([id,m,q])=>{if(m!='wash')return;const k=id+'|wash';S.cart[k]=(S.cart[k]||0)-q;if(S.cart[k]<=0)delete S.cart[k];addC(id,'iron',q)});CH.last=[];cAdded('همه رو «فقط اتو» کردم.')}
function cGo(){if(!tot().n)return bs('سبد خالیه! اول لباس‌هات رو انتخاب کن.',[['ثبت سفارش','order']]);cAsk('name')}
function cAsk(fd){CH.step=fd;bs({name:'اسم و فامیلت رو بگو',phone:'شماره موبایلت چنده؟',addr:'آدرس دقیق جمع‌آوری و تحویل؟',day:'برای چه روزی هماهنگ کنیم؟',slot:'کدوم بازه ساعتی خوبه؟',pay:'پرداخت چطوری باشه؟'}[fd],cf(fd))}
function cReask(m){bs(m||'متوجه نشدم، دوباره بگو یا از دکمه‌ها انتخاب کن.',cf(CH.step))}
function cSet(v){const s=CH.step;v=String(v||'').trim();
if(s=='name'){if(v.length<2)return cReask();S.u.name=v}
else if(s=='phone'){const p=en(v).replace(/\D/g,'');if(!/^09\d{9}$/.test(p))return cReask('شماره باید ۱۱ رقم و با ۰۹ شروع بشه، مثل ۰۹۱۲۱۲۳۴۵۶۷');S.u.phone=p}
else if(s=='addr'){if(v.length<6)return cReask('آدرس رو کامل‌تر بنویس (محله، خیابان، پلاک).');S.u.addr=v}
else if(s=='day')S.day=v;else if(s=='slot')S.slot=v;else if(s=='pay')S.pay=v;else return cMenu();
save();const i=FLD.indexOf(s);i+1<FLD.length?cAsk(FLD[i+1]):cSummary()}
function cSummary(){CH.step='confirm';const u=S.u;bs([{t:'همه‌چی آماده‌ست، یه نگاه بنداز:',h:`<div class="cd"><div>${esc(u.name)}، ${esc(u.phone)}</div><div>${esc(u.addr)}</div><div>${S.day}، ساعت ${S.slot}، ${S.pay=='online'?'پرداخت آنلاین':'پرداخت درب منزل'}</div></div>${ccard()}`}],[['تایید و ثبت سفارش','yes'],['تغییر لباس‌ها','order'],['لغو','clear']])}
function cPlace(){const t=tot();if(!t.n)return cMenu();const u=S.u,o={id:String(1000+S.orders.length+1),items:Object.entries(S.cart),total:t.t,name:u.name,phone:u.phone,addr:u.addr,day:S.day,slot:S.slot,pay:S.pay,note:'ثبت از چت',st:0,t:Date.now()};S.orders.push(o);if(t.sb)S.sub.left--;S.cart={};save();bdg();CH.step='';bs([{t:'',h:`<div class="tk"><b>سفارش ${fi(o.id)} ثبت شد</b><div class="mu">${o.day}، بازه ${o.slot}</div><div>مبلغ: ${f(o.total)} تومان</div></div><div>مسکات OnWash رسید! پیک توی بازه‌ای که گفتی میاد. هر وقت خواستی بگو «پیگیری».</div>`}],[['پیگیری سفارش','track'],['سفارش جدید','order']])}
function cTrack(){const o=S.orders.filter(x=>x.st<4).slice(-1)[0]||S.orders.slice(-1)[0];if(!o)return bs('هنوز سفارشی نداری! بریم اولین سفارشت رو ثبت کنیم؟',[['ثبت سفارش','order']]);const pc=Math.max(6,Math.round(o.st/4*100));bs([{t:'سفارش '+fi(o.id)+': '+STEPS[o.st],h:`<div class="pbar"><i style="width:${pc}%"></i></div><div class="mu">${lines(o)}</div><div class="mu">${o.day}، بازه ${o.slot}</div>`}],o.st<4?[['منوی اصلی','menu'],['سفارش جدید','order']]:[['سفارش مجدد','reorder'],['سفارش جدید','order']])}
function cRe(){const o=S.orders.slice(-1)[0];if(!o)return bs('هنوز سفارش قبلی نداری. بریم اولین سفارشت رو ثبت کنیم؟',[['ثبت سفارش','order']]);S.cart={};o.items.forEach(([k,q])=>S.cart[k]=q);save();bdg();bs([{t:'سفارش قبلیت رو گذاشتم توی سبد:',h:ccard()}],[['ادامه سفارش','go'],['تغییر لباس‌ها','order'],['خالی کردن سبد','clear']])}
function cSubs(){bs([{t:'اشتراک ماهانه ارسال رایگان و تخفیف داره:',h:'<div class="cd">'+PLANS.map(p=>`<div class="row"><span>${p.n}: ${f(p.c)} سفارش، ${f(p.d)}٪ تخفیف</span><b>${f(p.p)}</b></div>`).join('')+'</div>'}],PLANS.map(p=>['اشتراک '+p.n,'plan:'+p.n]).concat([['منوی اصلی','menu']]))}
function cPlan(n){const p=PLANS.find(x=>x.n==n);if(!p)return cMenu();S.sub={n,left:p.c};save();bs('اشتراک '+n+' فعال شد. '+f(p.c)+' سفارش با تخفیف و ارسال رایگان داری.',[['ثبت سفارش','order'],['منوی اصلی','menu']])}
function cFaq(){bs('چی می‌خوای بدونی؟',[['زمان تحویل','fq:t'],['هزینه ارسال','fq:s'],['روش پرداخت','fq:p'],['خرابی یا گم‌شدن لباس','fq:d'],['فقط اتو','fq:i'],['منوی اصلی','menu']])}
function cClear(){S.cart={};CH.step='';save();bdg();bs('سبد رو خالی کردم. هر وقت خواستی دوباره شروع کنیم.',MAIN)}
function cFq(v){bs(FQ[v]||FQ.t,[['سوال دیگه','faq'],['ثبت سفارش','order']])}
function cText(t){const x=en(t).trim(),s=CH.step;
if(/^(لغو|انصراف)/.test(x))return cClear();
if(s=='name'||s=='addr'||s=='phone')return cSet(t);
if(s=='day'){const d=/فردا/.test(x)?'فردا':/امروز/.test(x)?'امروز':'';return d?cSet(d):cReask()}
if(s=='slot'){const n=x.match(/\d+/g)||[],v=SLOTS.find(z=>n.includes(en(z).split(' ')[0]));return v?cSet(v):cReask()}
if(s=='pay'){const v=/درب|منزل|نقد|دستگاه|حضوری/.test(x)?'door':/آنلاین|اینترنت|درگاه|کارت/.test(x)?'online':'';return v?cSet(v):cReask()}
if(s=='confirm'&&/بله|تایید|ثبت|اوکی|باشه|آره/.test(x))return cPlace();
if(s=='qty'&&/\d|یه|یک|دو|سه|چهار|پنج/.test(x))return cQty(cq(x));
if(s=='svc')return cSvc(/اتو/.test(x)&&!/شست/.test(x)?'iron':'wash');
if(/پیگیری|وضعیت|کجاست|کجا رسید/.test(x))return cTrack();
if(/اشتراک/.test(x))return cSubs();
if(/مجدد|دوباره|قبلی/.test(x))return cRe();
const P=parseO(t);if(P.out.length){CH.step='';CH.last=P.out;P.out.forEach(([id,m,q])=>addC(id,m,q));return cAdded('اضافه شد'+(P.asm?'؛ جایی که نوع خدمت رو نگفتی «شست‌وشو و اتو» گذاشتم.':'.'),P.asm?[['همه رو فقط اتو کن','iron']]:[])}
if(/سبد/.test(x))return tot().n?cAdded('سبد فعلی تو:'):bs('سبدت خالیه.',MAIN);
if(/ادامه|تمام|همین/.test(x)&&tot().n)return cGo();
if(/ارسال|پیک|هزینه/.test(x))return cFq('s');
if(/پرداخت|پول/.test(x))return cFq('p');
if(/خراب|گم|خسارت/.test(x))return cFq('d');
if(/زمان|ساعت|چند روز|تحویل/.test(x))return cFq('t');
if(/سوال|راهنما/.test(x))return cFaq();
if(/سلام|درود/.test(x))return bs('سلام! خوش اومدی. چه کمکی می‌تونم بکنم؟',MAIN);
bs('متوجه نشدم! می‌تونی لباس‌ها رو اینجوری بنویسی: «۲ تا پیراهن اتو و ۱ کت شست‌وشو»، یا از دکمه‌ها استفاده کن.',tot().n?[['ادامه سفارش','go']].concat(MAIN):MAIN)}
const TABS=[['home',ic('hanger'),'خدمات'],['chat',ic('chat'),'چت'],['plans',ic('refresh'),'اشتراک'],['orders',ic('orders'),'سفارش‌ها'],['admin',ic('gear'),'مدیریت']];
function render(){const t=tot();$('#bc').textContent=f(t.n);$('#bc').style.display=t.n?'':'none';
